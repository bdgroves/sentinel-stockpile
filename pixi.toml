[workspace]
name = "sentinel-stockpile"
version = "3.0.0"
description = "Commodity stockpiles measured from Sentinel-2: the economy you can see from space"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
numpy = ">=1.26"
scipy = ">=1.12"
rasterio = ">=1.3"
shapely = ">=2.0"
pyproj = ">=3.6"
pillow = ">=10.0"
matplotlib = ">=3.8"
pystac-client = ">=0.7"
planetary-computer = ">=1.0"

[tasks]
update  = "python -m stockpile update"     # pixi run update --site vancouver_wind
rebuild = "python -m stockpile rebuild"    # reclassify cached scenes
publish = "python -m stockpile publish"
sites   = "python -m stockpile sites"
stacks  = "git fetch origin stacks && mkdir -p stacks && git archive FETCH_HEAD -o stacks.tar && tar -xf stacks.tar -C stacks && rm stacks.tar"
serve   = "python -m http.server 8000 -d docs"
calibrate = "python tools/calibrate.py"   # pixi run calibrate --site tacoma_port
summers = "python tools/summers.py"
