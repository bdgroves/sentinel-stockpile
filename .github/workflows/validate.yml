name: NAIP validation images

# Pulls the latest USDA NAIP aerial photo (0.6 m) over each site's yard onto
# the site grid, for checking what the classifier calls a stockpile.
on:
  workflow_dispatch:
    inputs:
      scout:
        description: "Instead, scout points: name:lat:lon[:half] separated by spaces"
        default: ""

permissions:
  contents: write

jobs:
  naip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - if: inputs.scout == ''
        run: for s in $(python -m stockpile sites | tr -d '[]",'); do python -m stockpile validate --site $s; done
      - if: inputs.scout != ''
        run: |
          for p in ${{ inputs.scout }}; do
            IFS=: read -r name lat lon half <<< "$p"
            python -m stockpile scout --name "$name" --lat "$lat" --lon "$lon" --half "${half:-2500}"
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation && git commit -q -m "NAIP validation images [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 10; done
